<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>좌표평면 위의 점의 좌표 - 실시간 랭킹전</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #f8fafc;
    }
    #plane-svg {
      touch-action: none;
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      cursor: grab;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }
    #plane-svg:active { cursor: grabbing; }
    .draggable-point { cursor: pointer; transition: r 0.2s, filter 0.2s; }
    .draggable-point:hover { r: 1.2; }
    .coord-input {
      width: 3rem;
      text-align: center; font-weight: 700; font-size: 1.25rem;
      border: 2px solid #cbd5e1; border-radius: 0.5rem; padding: 0.25rem; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .coord-input:focus { border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
    .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <div id="login-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl fade-in">
      <h2 class="text-2xl font-black text-blue-600 mb-2">좌표평면 마스터</h2>
      <p class="text-slate-500 text-sm mb-6">자신의 학번과 이름을 입력하고<br>최단 기록에 도전하세요!</p>
      <input type="text" id="player-name-input" class="w-full text-center text-lg font-bold border-2 border-slate-300 rounded-xl p-3 mb-4 outline-none focus:border-blue-500 transition-colors" placeholder="예: 10101 홍길동" autocomplete="off">
      <button onclick="startGame()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-transform active:scale-95 shadow-lg">
        도전 시작!
      </button>
    </div>
  </div>

  <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap justify-between items-center sticky top-0 z-10 shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-blue-600 text-white rounded-lg p-2 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M19 9l-5 5-4-4-3 3"/></svg>
      </div>
      <h1 class="text-xl md:text-2xl font-black text-slate-800 tracking-tight">좌표평면 위의 좌표</h1>
    </div>
    
    <div class="flex gap-4 items-center mt-3 md:mt-0 flex-wrap justify-end">
      <div class="font-bold text-blue-600 hidden md:block" id="display-player-name"></div>
      
      <!-- 순위 확인 버튼 -->
      <button onclick="openRankingModal()" class="flex items-center gap-1 text-sm bg-yellow-100 text-yellow-700 font-bold px-3 py-1.5 rounded-full hover:bg-yellow-200 transition-colors shadow-sm">
        🏆 순위
      </button>

      <!-- 초기화 버튼 추가 -->
      <button onclick="resetGame()" class="flex items-center gap-1 text-sm bg-rose-100 text-rose-700 font-bold px-3 py-1.5 rounded-full hover:bg-rose-200 transition-colors shadow-sm">
        🔄 초기화
      </button>

      <!-- 타이머 -->
      <div class="flex items-center gap-2 text-slate-500 font-bold bg-slate-100 px-3 py-1.5 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="timer-display" class="w-12 text-center">00:00</span>
      </div>
      <!-- 성공 카운트 -->
      <div class="flex items-center gap-2 text-orange-600 font-bold bg-orange-100 px-3 py-1.5 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span id="streak-display">0 / 5</span>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-4xl mx-auto p-4 md:p-6 flex flex-col md:flex-row gap-6 items-start opacity-0 transition-opacity duration-500" id="main-content">
    <div class="w-full md:w-1/2 flex flex-col gap-6">
      <div class="bg-slate-200 p-1 rounded-xl flex shadow-inner">
        <button id="mode-read-btn" class="flex-1 py-3 text-center rounded-lg font-bold text-slate-600 transition-all shadow bg-white text-blue-600" onclick="setMode('READ')">📍 좌표 읽기</button>
        <button id="mode-plot-btn" class="flex-1 py-3 text-center rounded-lg font-bold text-slate-600 transition-all hover:bg-white/50" onclick="setMode('PLOT')">🎯 점 찍기</button>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm min-h-[140px] flex flex-col justify-center">
        <p id="mission-title" class="text-sm font-bold text-slate-400 mb-2 uppercase tracking-wide">Mission</p>
        <p id="mission-text" class="text-xl md:text-2xl font-bold leading-relaxed"></p>
      </div>

      <div id="input-control" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center gap-4">
        <p class="text-sm font-bold text-slate-500">순서쌍의 모양에 맞게 숫자를 입력하세요.</p>
        <div class="flex items-center text-3xl font-bold text-slate-700">
          $A($
          <!-- type="text"로 변경하여 태블릿에서 마이너스(-) 기호 입력이 쉽게 함 -->
          <input type="text" id="input-x" class="coord-input mx-2" autocomplete="off" placeholder="x">
          ,
          <input type="text" id="input-y" class="coord-input mx-2" autocomplete="off" placeholder="y">
          $)$
        </div>
      </div>

      <button onclick="checkAnswer()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-xl shadow-lg transition-transform transform active:scale-95">정답 확인</button>
      <div id="feedback-box" class="hidden text-center font-bold text-lg p-4 rounded-xl border fade-in"></div>
    </div>

    <div class="w-full md:w-1/2 bg-white p-2 md:p-4 rounded-3xl border-2 border-slate-200 shadow-sm relative">
      <svg id="plane-svg" viewBox="-6 -6 12 12" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
          </marker>
        </defs>
        <g id="grid-group"></g>
        <g id="hint-group" class="transition-opacity duration-300 opacity-0">
          <line id="hint-line-x" x1="0" y1="0" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.1" stroke-dasharray="0.3,0.2" />
          <line id="hint-line-y" x1="0" y1="0" x2="0" y2="0" stroke="#8B5CF6" stroke-width="0.1" stroke-dasharray="0.3,0.2" />
        </g>
        <line x1="-5.8" y1="0" x2="5.8" y2="0" stroke="#334155" stroke-width="0.08" marker-end="url(#arrow)" marker-start="url(#arrow)" />
        <line x1="0" y1="-5.8" x2="0" y2="5.8" stroke="#334155" stroke-width="0.08" marker-end="url(#arrow)" marker-start="url(#arrow)" />
        <text x="5.5" y="-0.3" font-size="0.6" font-style="italic" font-weight="bold" fill="#334155">x</text>
        <text x="0.3" y="5.5" font-size="0.6" font-style="italic" font-weight="bold" fill="#334155">y</text>
        <text x="-0.5" y="-0.2" font-size="0.6" font-style="italic" font-weight="bold" fill="#334155">O</text>
        <g id="labels-group"></g>
        <g id="point-group">
          <circle id="point-glow" cx="0" cy="0" r="0.6" fill="#FED7AA" class="transition-opacity opacity-0" />
          <circle id="point-main" class="draggable-point" cx="0" cy="0" r="0.25" fill="#EA580C" />
          <text id="point-label" x="0.3" y="0.4" font-size="0.5" font-weight="bold" fill="#EA580C">A</text>
        </g>
      </svg>
      <div id="drag-badge" class="hidden absolute top-6 right-6 bg-slate-800/80 text-white text-xs font-bold px-3 py-1.5 rounded-full pointer-events-none backdrop-blur-sm fade-in">👇 점 A를 드래그하세요</div>
    </div>
  </main>

  <div id="ranking-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[120] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-lg w-full text-center shadow-2xl fade-in max-h-[90vh] overflow-y-auto">
      <h2 class="text-2xl font-black text-slate-800 mb-6">🏆 종합 명예의 전당 (TOP 3)</h2>
      
      <div class="flex flex-col md:flex-row gap-4 mb-6">
        <div class="flex-1 bg-blue-50 rounded-xl p-4 border border-blue-100">
          <h3 class="font-bold text-blue-700 mb-3">📍 좌표 읽기</h3>
          <ul id="top3-read-list" class="text-left text-sm space-y-2">
            <li class="text-center text-slate-400 py-2">불러오는 중...</li>
          </ul>
        </div>
        <div class="flex-1 bg-orange-50 rounded-xl p-4 border border-orange-100">
          <h3 class="font-bold text-orange-700 mb-3">🎯 점 찍기</h3>
          <ul id="top3-plot-list" class="text-left text-sm space-y-2">
            <li class="text-center text-slate-400 py-2">불러오는 중...</li>
          </ul>
        </div>
      </div>

      <button onclick="closeRankingModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition-transform active:scale-95">닫기</button>
    </div>
  </div>

  <div id="success-modal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full text-center shadow-2xl fade-in max-h-[90vh] overflow-y-auto">
      <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2"><span class="text-3xl">🏆</span></div>
      <h2 class="text-2xl font-black text-slate-800 mb-1">마스터 완료!</h2>
      <div class="text-lg text-slate-800 font-bold mb-4">나의 기록: <span id="final-time-record" class="text-blue-600 text-2xl"></span></div>
      
      <div class="bg-slate-50 rounded-xl p-4 mb-6 border border-slate-200">
        <h3 class="font-bold text-slate-500 mb-3 flex items-center justify-center gap-2"><span>🔥 <span id="current-mode-name"></span> TOP 30</span></h3>
        <ul id="leaderboard-list" class="text-left text-sm">
          <li class="text-center text-slate-400 py-2">랭킹 불러오는 중...</li>
        </ul>
      </div>

      <button onclick="resetGame()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition-transform active:scale-95">기록 갱신 재도전</button>
    </div>
  </div>

  <script>
    // --- 파이어베이스 설정 및 초기화 (호환성 버전) ---
    const firebaseConfig = {
      apiKey: "AIzaSyA5q6PVwJt56E1EGy9WZB_33lZlnSr-ElQ",
      authDomain: "coordinate-plane-ordered-pair.firebaseapp.com",
      databaseURL: "https://coordinate-plane-ordered-pair-default-rtdb.firebaseio.com",
      projectId: "coordinate-plane-ordered-pair",
      storageBucket: "coordinate-plane-ordered-pair.firebasestorage.app",
      messagingSenderId: "178591771622",
      appId: "1:178591771622:web:6542d64089ab997cb50427"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 점수 전송 시 모드(mode)별로 분리해서 저장
    function submitScore(playerName, timeTaken, mode) {
      database.ref('scores/' + mode).push({
        name: playerName,
        time: timeTaken,
        timestamp: Date.now()
      });
    }

    // 성공 모달의 TOP 30 불러오기
    function loadLeaderboard(mode) {
      const scoresRef = database.ref('scores/' + mode).orderByChild('time').limitToFirst(30);
      scoresRef.once('value', (snapshot) => {
        const leaderboardList = document.getElementById('leaderboard-list');
        leaderboardList.innerHTML = '';
        
        let count = 1;
        snapshot.forEach((childSnapshot) => {
          if (count <= 30) {
            const data = childSnapshot.val();
            const mins = Math.floor(data.time / 60).toString().padStart(2, '0');
            const secs = (data.time % 60).toString().padStart(2, '0');
            
            const li = document.createElement('li');
            li.className = "flex justify-between items-center py-2 border-b border-slate-100 last:border-0";
            li.innerHTML = `<span class="font-bold text-slate-700">${count}위. ${data.name}</span><span class="text-blue-600 font-bold">${mins}:${secs}</span>`;
            leaderboardList.appendChild(li);
            count++;
          }
        });
        
        if(count === 1) {
            leaderboardList.innerHTML = '<li class="text-center text-slate-500 py-2">아직 등록된 기록이 없습니다.</li>';
        }
      });
    }

    // --- 전체 순위(TOP 3) 모달 제어 로직 ---
    function openRankingModal() {
      document.getElementById('ranking-modal').classList.remove('hidden');
      loadTop3Ranking();
    }

    function closeRankingModal() {
      document.getElementById('ranking-modal').classList.add('hidden');
    }

    function loadTop3Ranking() {
      const modes = ['READ', 'PLOT'];
      modes.forEach(mode => {
        const ref = database.ref('scores/' + mode).orderByChild('time').limitToFirst(3);
        ref.once('value', (snapshot) => {
          const listId = mode === 'READ' ? 'top3-read-list' : 'top3-plot-list';
          const listElement = document.getElementById(listId);
          listElement.innerHTML = '';
          
          let count = 1;
          snapshot.forEach((child) => {
            if (count <= 3) {
              const data = child.val();
              const mins = Math.floor(data.time / 60).toString().padStart(2, '0');
              const secs = (data.time % 60).toString().padStart(2, '0');
              const li = document.createElement('li');
              li.className = "flex justify-between items-center py-1 border-b border-slate-200 last:border-0";
              li.innerHTML = `<span class="font-bold text-slate-700">${count}. ${data.name}</span><span class="text-blue-600 font-bold">${mins}:${secs}</span>`;
              listElement.appendChild(li);
              count++;
            }
          });
          if(count === 1) {
              listElement.innerHTML = '<li class="text-center text-slate-400 py-2">기록이 없습니다.</li>';
          }
        });
      });
    }

    // --- 시스템 변수 ---
    const GRID_MIN = -5;
    const GRID_MAX = 5;
    const WIN_STREAK = 5;
    const AXIS_PROB = 0.3;

    let currentMode = 'READ';
    let targetPoint = { x: 0, y: 0 };
    let currentPoint = { x: 0, y: 0 };
    let streak = 0;
    let timerInterval = null;
    let elapsedSeconds = 0;
    let isDragging = false;
    let currentPlayerName = "";
    
    // 연타(꼼수) 방지를 위한 락(Lock) 변수
    let isChecking = false; 

    // --- 로그인 및 게임 시작 ---
    function startGame() {
      const nameInput = document.getElementById('player-name-input').value.trim();
      if (!nameInput) {
        alert("학번과 이름을 입력해주세요!");
        return;
      }
      
      currentPlayerName = nameInput;
      document.getElementById('display-player-name').textContent = currentPlayerName + ' 님';
      
      document.getElementById('login-modal').classList.add('hidden');
      document.getElementById('main-content').classList.remove('opacity-0');
      
      drawGridAndLabels();
      setupDragEvents();
      startTimer();
      setMode('READ');
    }

    // --- 수식 렌더링 ---
    function renderMath() {
      if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(document.body, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ],
          throwOnError: false
        });
      }
    }

    // --- SVG 격자 생성 ---
    function drawGridAndLabels() {
      const gridGroup = document.getElementById('grid-group');
      const labelsGroup = document.getElementById('labels-group');
      gridGroup.innerHTML = '';
      labelsGroup.innerHTML = '';
      for (let i = GRID_MIN; i <= GRID_MAX; i++) {
        if (i !== 0) {
          const vLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
          vLine.setAttribute("x1", i); vLine.setAttribute("y1", GRID_MIN);
          vLine.setAttribute("x2", i); vLine.setAttribute("y2", GRID_MAX);
          vLine.setAttribute("stroke", "#e2e8f0"); vLine.setAttribute("stroke-width", "0.04");
          gridGroup.appendChild(vLine);
          
          const hLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
          hLine.setAttribute("x1", GRID_MIN);
          hLine.setAttribute("y1", -i);
          hLine.setAttribute("x2", GRID_MAX); hLine.setAttribute("y2", -i);
          hLine.setAttribute("stroke", "#e2e8f0"); hLine.setAttribute("stroke-width", "0.04");
          gridGroup.appendChild(hLine);
          
          const textX = document.createElementNS("http://www.w3.org/2000/svg", "text");
          textX.setAttribute("x", i); textX.setAttribute("y", "-0.3");
          textX.setAttribute("font-size", "0.38"); textX.setAttribute("font-weight", "bold");
          textX.setAttribute("text-anchor", "middle"); textX.setAttribute("fill", "#0f172a");
          textX.textContent = i;
          labelsGroup.appendChild(textX);
          
          const textY = document.createElementNS("http://www.w3.org/2000/svg", "text");
          textY.setAttribute("x", "0.2");
          textY.setAttribute("y", -i + 0.12);
          textY.setAttribute("font-size", "0.38"); textY.setAttribute("font-weight", "bold");
          textY.setAttribute("text-anchor", "start"); textY.setAttribute("fill", "#0f172a");
          textY.textContent = i;
          labelsGroup.appendChild(textY);
        }
      }
    }

    // --- 문제 생성 ---
    function generateQuestion() {
      hideHint();
      hideFeedback();
      isChecking = false; // 새로운 문제가 나오면 잠금 해제 (연타 방지용)
      
      let x, y;
      const isAxis = Math.random() < AXIS_PROB;
      if (isAxis) {
        if (Math.random() < 0.5) { x = 0; y = getRandomIntExclude0(GRID_MIN, GRID_MAX); }
        else { x = getRandomIntExclude0(GRID_MIN, GRID_MAX); y = 0; }
      } else {
        x = getRandomIntExclude0(GRID_MIN, GRID_MAX);
        y = getRandomIntExclude0(GRID_MIN, GRID_MAX);
      }
      targetPoint = { x, y };
      
      const missionText = document.getElementById('mission-text');
      if (currentMode === 'READ') {
        missionText.innerHTML = `좌표평면 위에 찍힌 점 $A$의<br>순서쌍 좌표를 읽어보세요.`;
        document.getElementById('input-control').classList.remove('hidden');
        document.getElementById('drag-badge').classList.add('hidden');
        document.getElementById('input-x').value = '';
        document.getElementById('input-y').value = '';
        document.getElementById('input-x').focus();
        updatePointLocation(targetPoint.x, targetPoint.y);
      } else {
        missionText.innerHTML = `점 $A(${x}, ${y})$의 위치를 찾아<br>올바른 곳에 점을 옮기세요.`;
        document.getElementById('input-control').classList.add('hidden');
        document.getElementById('drag-badge').classList.remove('hidden');
        currentPoint = { x: 0, y: 0 };
        updatePointLocation(0, 0);
      }
      renderMath();
    }

    function getRandomIntExclude0(min, max) {
      let val = 0;
      while (val === 0) { val = Math.floor(Math.random() * (max - min + 1)) + min; }
      return val;
    }

    function updatePointLocation(x, y) {
      document.getElementById('point-main').setAttribute('cx', x);
      document.getElementById('point-main').setAttribute('cy', -y);
      document.getElementById('point-glow').setAttribute('cx', x);
      document.getElementById('point-glow').setAttribute('cy', -y);
      document.getElementById('point-label').setAttribute('x', x + 0.3);
      document.getElementById('point-label').setAttribute('y', -y + 0.4);
    }

    function showHint(pointX, pointY) {
      const hintLineX = document.getElementById('hint-line-x');
      const hintLineY = document.getElementById('hint-line-y');
      hintLineX.setAttribute('x1', pointX); hintLineX.setAttribute('y1', -pointY);
      hintLineX.setAttribute('x2', pointX); hintLineX.setAttribute('y2', 0);
      hintLineY.setAttribute('x1', pointX); hintLineY.setAttribute('y1', -pointY);
      hintLineY.setAttribute('x2', 0); hintLineY.setAttribute('y2', -pointY);
      document.getElementById('hint-group').classList.remove('opacity-0');
    }
    
    function hideHint() { document.getElementById('hint-group').classList.add('opacity-0'); }

    // --- 정답 확인 ---
    function checkAnswer() {
      // 이미 정답 처리가 진행 중이면 (연타 시) 함수를 즉시 종료
      if (isChecking) return; 

      let isSuccess = false;
      let errorType = 'GENERAL';

      if (currentMode === 'READ') {
        // type="text" 로 바꿨기 때문에 parseInt 로 변환해서 검증
        const inX = parseInt(document.getElementById('input-x').value);
        const inY = parseInt(document.getElementById('input-y').value);
        
        if (isNaN(inX) || isNaN(inY)) {
          showFeedback(false, "x와 y 좌표를 모두 숫자로 입력해주세요.");
          shakeInput(); return;
        }
        if (inX === targetPoint.x && inY === targetPoint.y) { isSuccess = true; }
        else {
          if (inX === targetPoint.y && inY === targetPoint.x) errorType = 'REVERSED';
          else if (targetPoint.x === 0 || targetPoint.y === 0) errorType = 'AXIS';
          showHint(targetPoint.x, targetPoint.y); shakeInput();
        }
      } else { 
        if (currentPoint.x === targetPoint.x && currentPoint.y === targetPoint.y) { isSuccess = true; }
        else {
          if (currentPoint.x === targetPoint.y && currentPoint.y === targetPoint.x) errorType = 'REVERSED';
          else if (targetPoint.x === 0 || targetPoint.y === 0) errorType = 'AXIS';
          showHint(currentPoint.x, currentPoint.y);
          const pGroup = document.getElementById('point-group');
          pGroup.classList.remove('shake');
          void pGroup.offsetWidth; pGroup.classList.add('shake');
        }
      }

      if (isSuccess) {
        isChecking = true; // 정답 맞춤! 다음 문제가 나올 때까지 잠금 (연타 방지)
        streak++;
        document.getElementById('streak-display').textContent = `${streak} / ${WIN_STREAK}`;
        showFeedback(true, `정답입니다! 🎉`);
        
        if (streak >= WIN_STREAK) {
          clearInterval(timerInterval);
          submitScore(currentPlayerName, elapsedSeconds, currentMode);
          setTimeout(showModal, 1000); // 1초 뒤 성공 모달 띄우기
        } else { 
          setTimeout(generateQuestion, 1500); // 1.5초 뒤 다음 문제 출제
        }
      } else {
        document.getElementById('streak-display').textContent = `${streak} / ${WIN_STREAK}`;
        let msg = "";
        if (errorType === 'REVERSED') msg = "아쉽습니다. 😢<br>가로($x$축)를 먼저, 세로($y$축)를 다음에 봐야 해요!";
        else if (errorType === 'AXIS') msg = "아쉽습니다. 😢<br>좌표 중 하나가 0일 때는 한쪽 축 위로만 움직입니다.";
        else msg = "아쉽습니다. 😢<br>보라색 점선을 따라 눈금을 다시 천천히 읽어보세요!";
        showFeedback(false, msg);
      }
      renderMath();
    }

    function shakeInput() {
      if (currentMode === 'READ') {
        const box = document.getElementById('input-control');
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      }
    }

    function showFeedback(isSuccess, text) {
      const fBox = document.getElementById('feedback-box');
      fBox.classList.remove('hidden');
      if (isSuccess) fBox.className = "fade-in text-center font-bold text-lg p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800";
      else fBox.className = "fade-in text-center font-bold text-lg p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-800";
      fBox.innerHTML = text;
    }
    
    function hideFeedback() { document.getElementById('feedback-box').classList.add('hidden'); }

    function showModal() {
      const mins = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
      const secs = (elapsedSeconds % 60).toString().padStart(2, '0');
      document.getElementById('final-time-record').textContent = `${mins}:${secs}`;
      document.getElementById('success-modal').classList.remove('hidden');
      document.getElementById('current-mode-name').textContent = currentMode === 'READ' ? '좌표 읽기' : '점 찍기';
      
      loadLeaderboard(currentMode);
      renderMath();
    }

    // --- 수동 초기화 및 재시작 ---
    function resetGame() {
      document.getElementById('success-modal').classList.add('hidden');
      streak = 0; 
      elapsedSeconds = 0;
      isChecking = false; // 잠금 해제
      document.getElementById('streak-display').textContent = `${streak} / ${WIN_STREAK}`;
      document.getElementById('timer-display').textContent = `00:00`;
      
      clearInterval(timerInterval); 
      startTimer(); 
      generateQuestion();
    }

    function setMode(mode) {
      currentMode = mode; streak = 0;
      document.getElementById('streak-display').textContent = `${streak} / ${WIN_STREAK}`;
      const btnRead = document.getElementById('mode-read-btn');
      const btnPlot = document.getElementById('mode-plot-btn');
      if (mode === 'READ') {
        btnRead.className = "flex-1 py-3 text-center rounded-lg font-bold transition-all shadow bg-white text-blue-600";
        btnPlot.className = "flex-1 py-3 text-center rounded-lg font-bold transition-all hover:bg-white/50 text-slate-600";
      } else {
        btnPlot.className = "flex-1 py-3 text-center rounded-lg font-bold transition-all shadow bg-white text-blue-600";
        btnRead.className = "flex-1 py-3 text-center rounded-lg font-bold transition-all hover:bg-white/50 text-slate-600";
      }
      generateQuestion();
    }

    function setupDragEvents() {
      const svg = document.getElementById('plane-svg');
      const pGlow = document.getElementById('point-glow');
      const getEventPoint = (e) => {
        if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
      };

      const startDrag = (e) => {
        if (currentMode !== 'PLOT') return;
        isDragging = true; pGlow.classList.remove('opacity-0');
        document.getElementById('drag-badge').classList.add('hidden');
        hideHint(); updateSvgPosition(e);
      };

      const doDrag = (e) => { if (!isDragging) return; e.preventDefault(); updateSvgPosition(e); };
      const endDrag = () => { if (!isDragging) return; isDragging = false; pGlow.classList.add('opacity-0'); };
      const updateSvgPosition = (e) => {
        const pt = getEventPoint(e);
        const rect = svg.getBoundingClientRect();
        const scaleX = 12 / rect.width; const scaleY = 12 / rect.height;
        let svgX = (pt.x - rect.left) * scaleX - 6;
        let svgY = (pt.y - rect.top) * scaleY - 6;
        let gridX = Math.round(svgX); let gridY = Math.round(-svgY);
        
        if (gridX < GRID_MIN) gridX = GRID_MIN;
        if (gridX > GRID_MAX) gridX = GRID_MAX;
        if (gridY < GRID_MIN) gridY = GRID_MIN;
        if (gridY > GRID_MAX) gridY = GRID_MAX;
        currentPoint = { x: gridX, y: gridY }; updatePointLocation(gridX, gridY);
      };

      svg.addEventListener('mousedown', startDrag);
      window.addEventListener('mousemove', doDrag);
      window.addEventListener('mouseup', endDrag);
      svg.addEventListener('touchstart', startDrag, { passive: false });
      window.addEventListener('touchmove', doDrag, { passive: false });
      window.addEventListener('touchend', endDrag);
    }

    document.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const isLoginModalHidden = document.getElementById('login-modal').classList.contains('hidden');
        const isRankingModalHidden = document.getElementById('ranking-modal').classList.contains('hidden');
        
        if (!isLoginModalHidden) {
          startGame();
        } else if (isLoginModalHidden && isRankingModalHidden && currentMode === 'READ') {
          checkAnswer();
        }
      }
    });

    function startTimer() {
      // 기존에 실행 중이던 타이머가 있다면 겹치지 않게 우선 제거
      if (timerInterval) clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        const mins = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
        const secs = (elapsedSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').textContent = `${mins}:${secs}`;
      }, 1000);
    }
  </script>
</body>
</html>
